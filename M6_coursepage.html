<h2 id="ryh-q1--open-loop-saturation">RYH Q1 — Open-Loop Saturation</h2>
<p><strong>RAISE YOUR HAND AS THE OPTIONS ARE CALLED.</strong></p>
<blockquote>
<p>A bare op-amp with no feedback is powered by ±5 V. A 0.1 mV sine wave is applied to the non-inverting input; the inverting input is grounded. What does the output look like?</p>
<ul>
<li>A)   A 10 V peak-to-peak sine wave — gain = 100,000 applied to the input</li>
</ul>
</blockquote>
</section>

<h2 id="ryh-q1--open-loop-saturation-1">RYH Q1 — Open-Loop Saturation</h2>
<p><strong>RAISE YOUR HAND AS THE OPTIONS ARE CALLED.</strong></p>
<blockquote>
<p>A bare op-amp with no feedback is powered by ±5 V. A 0.1 mV sine wave is applied to the non-inverting input; the inverting input is grounded. What does the output look like?</p>
<ul>
<li>A)   A 10 V peak-to-peak sine wave — gain = 100,000 applied to the input</li>
<li>B)   A ±5 V square wave — input drives the output to saturation on every half cycle</li>
</ul>
</blockquote>
</section>

<h2 id="ryh-q1--open-loop-saturation-2">RYH Q1 — Open-Loop Saturation</h2>
<p><strong>RAISE YOUR HAND AS THE OPTIONS ARE CALLED.</strong></p>
<blockquote>
<p>A bare op-amp with no feedback is powered by ±5 V. A 0.1 mV sine wave is applied to the non-inverting input; the inverting input is grounded. What does the output look like?</p>
<ul>
<li>A)   A 10 V peak-to-peak sine wave — gain = 100,000 applied to the input</li>
<li>B)   A ±5 V square wave — input drives the output to saturation on every half cycle</li>

<blockquote>
<p>A bare op-amp with no feedback is powered by ±5 V. A 0.1 mV sine wave is applied to the non-inverting input; the inverting input is grounded. What does the output look like?</p>
<ul>
<li>A)   A 10 V peak-to-peak sine wave — gain = 100,000 applied to the input</li>
<li>B)   A ±5 V square wave — input drives the output to saturation on every half cycle</li>

<th>Closed-loop gain ≈ 1/β</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>

</tr>
<tr>
<td>0.5</td>
<td>2</td>
</tr>
<tr>

<div style="flex:1;border-left:3px solid #C99700;padding-left:26px;">
<p>β is set by the <strong>resistor network</strong> in the feedback path — not by the op-amp.</p>
<p>When A is large:  <strong>closed-loop gain ≈ 1/β</strong></p>
<p>The imprecise op-amp disappears. Only the resistors remain.</p>

<h2 id="widget-2--the-loop-settles">Widget 2 — The Loop Settles</h2>
<p><strong>A = 100,000    β = 0.5    V_in = 1 V    V_SAT = ±5 V  →  V_out settles at 2 V</strong></p>
<p>Each <strong>Step</strong> traces one sub-step of the feedback loop:</p>
<ol>
<li><strong>Σ</strong> — error ε = V₊ − V₋ detected at summing junction</li>
<li><strong>A</strong> — V_out = A · ε (railed on first iteration)</li>
<li><strong>β</strong> — V₋ updated; gap between V₊ and V₋ shrinks</li>
</ol>
<p><strong>Switch to Positive Feedback — same setup, loop diverges to rail.</strong></p>
<p><em>Golden Rule 1 is not a rule. It is what ε → 0 means.</em></p>

<h2 id="why-unity-gain-is-not-the-point">Why Unity Gain Is Not the Point</h2>
<div style="display:flex;gap:32px;align-items:flex-start;margin-top:16px;">
<div style="flex:1;">
<p><strong>Infinite input impedance</strong></p>
<p>From Rule 2 (Virtual Open): no current into V₊</p>
<ul>
<li>Source sees no load</li>
<li>Divider ratio undisturbed</li>
<li>Voltage at divider = what resistors predict</li>
</ul>
<p><em>A wire draws current. The follower draws none.</em></p>
</div>
<div style="flex:1;border-left:3px solid #C99700;padding-left:26px;">
<p><strong>Zero output impedance</strong></p>
<p>Feedback defends V_out against any load:</p>
<ol>
<li>Load demands current → V_out dips</li>
<li>Error ε = V₊ − V₋ appears</li>
<li>Op-amp pushes harder</li>
<li>V_out restored — for any load</li>
</ol>
<p><em>Load current path: supply → op-amp → load.</em><br />
<em>Signal source supplies nothing.</em></p>
</div>
