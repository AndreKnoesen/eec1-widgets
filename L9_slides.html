<h2 id="from-command-line-to-gui">From Command Line to GUI</h2>
<div style="display:flex; gap:2rem; align-items:flex-start;">
<div style="flex:1;">
<p><strong>Then — command line only</strong></p>
<ul>
<li>Type a command, get output</li>
<li>Script runs top-to-bottom and exits</li>
<li>You have to know how to program</li>
</ul>
</div>
<div style="flex:1;">
<p><strong>Now — graphical user interface</strong></p>
<ul>
<li>Buttons, menus, dropdowns, plots</li>
<li>Anyone can operate it — no programming needed</li>
<li>Code runs <em>only when the user does something</em></li>
</ul>
</div>
</div>

<h2 id="value-class-in-a-callback-1">Value Class in a Callback</h2>
<blockquote>
<p>&quot;Your pre-lecture assignment wrote <code>TrafficLight</code> as a <span style="color:#cc0000; font-weight:bold;">value class</span>. When the App Designer callback calls <code>app.TL.Advance()</code> — does the traffic light state actually change?&quot;</p>
</blockquote>
<p><strong>(a)</strong> Yes — <code>Advance</code> runs and <code>currState</code> updates — <em>hands up</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="value-class-in-a-callback-2">Value Class in a Callback</h2>
<blockquote>
<p>&quot;Your pre-lecture assignment wrote <code>TrafficLight</code> as a <span style="color:#cc0000; font-weight:bold;">value class</span>. When the App Designer callback calls <code>app.TL.Advance()</code> — does the traffic light state actually change?&quot;</p>
</blockquote>
<p><strong>(a)</strong> Yes     <strong>(b)</strong> No — the state silently resets every click — <em>hands up</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="value-classes-dont-persist-changes">Value Classes Don't Persist Changes</h2>
<p><strong>(b) No</strong> — the state does not change.</p>
<p>A <strong>value class</strong> copies the object on every method call:</p>
<pre><code class="language-matlab">app.TL.Advance()   <span class="hljs-comment">% creates a temp copy, advances it, discards it</span>
                   <span class="hljs-comment">% app.TL is unchanged — light never moves</span>
</code></pre>
<p>To make it work with a value class you would need:</p>
<pre><code class="language-matlab">app.TL = app.TL.Advance();   <span class="hljs-comment">% capture the returned copy</span>
</code></pre>
<p>But there is a cleaner fix.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="handle-classes-fix-this">Handle Classes Fix This</h2>
<p>A <strong>handle class</strong> (<code>&lt; handle</code>) stores a reference, not a copy:</p>
<pre><code class="language-matlab">app.TL.Advance()   <span class="hljs-comment">% modifies the object directly — no assignment needed</span>
</code></pre>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.5rem 1rem; background: #f9f9f9; font-size: 0.88em; margin: 0.4rem 0;">
<strong>Rule:</strong> any backend object that must change state across callbacks should be a <strong>handle class</strong>. This is exactly why <code>SensorDataAnalyzer</code> in MP5 will also inherit from <code>handle</code>.
</div>
<p>The corrected <code>TrafficLight</code> uses <code>classdef TrafficLight &lt; handle</code> — <code>Advance</code> takes no return value and modifies <code>currState</code> in place.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">

<h2 id="what-is-a-callback">What Is a Callback?</h2>
<p>In OOP you wrote <strong>methods</strong> called by your own code: <code>obj.Advance()</code>.</p>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.5rem 1rem; background: #f9f9f9; font-size: 0.88em; margin: 0.4rem 0;">
A <strong>callback</strong> is a method that App Designer calls automatically when a user interacts with a UI component. You write the body — App Designer calls it.
</div>
<pre><code class="language-matlab"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">AdvanceStateButtonPushed</span><span class="hljs-params">(app, event)</span></span>
    <span class="hljs-comment">% runs when the button is pressed — you never call this directly</span>
<span class="hljs-keyword">end</span>
</code></pre>
<ul>
<li><code>app</code> — the running application (same role as <code>obj</code> in your OOP classes)</li>
<li><code>event</code> — details about the trigger (button pressed, dropdown changed, …)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="where-should-trafficlight-live">Where Should <code>TrafficLight</code> Live?</h2>
<blockquote>
<p>&quot;The <code>TrafficLight</code> object must survive every button click. Should it be a local variable inside the callback, or an app property?&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">

<blockquote>
<p>&quot;The <code>TrafficLight</code> object must survive every button click. Should it be a local variable inside the callback, or an app property?&quot;</p>
</blockquote>
<p><strong>(a)</strong> Local variable — declare it inside the callback — <em>hands up</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="where-should-trafficlight-live-2">Where Should <code>TrafficLight</code> Live?</h2>
<blockquote>
<p>&quot;The <code>TrafficLight</code> object must survive every button click. Should it be a local variable inside the callback, or an app property?&quot;</p>
</blockquote>
<p><strong>(a)</strong> Local variable     <strong>(b)</strong> App property — declare it in the <code>properties</code> block — <em>hands up</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="where-should-trafficlight-live-3">Where Should <code>TrafficLight</code> Live?</h2>
<blockquote>
<p>&quot;The <code>TrafficLight</code> object must survive every button click. Should it be a local variable inside the callback, or an app property?&quot;</p>
</blockquote>
<p><strong>(a)</strong> Local variable     <strong>(b)</strong> App property     <strong>(c)</strong> Either — both work the same way — <em>hands up</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="properties-survive-callbacks">Properties Survive Callbacks</h2>
<p><strong>(b) App property</strong> is correct.</p>
<ul>
<li>A <strong>local variable</strong> is created when a callback runs and destroyed when it returns</li>
<li>An <strong>app property</strong> belongs to the <code>app</code> object — persists until the app closes</li>
</ul>
<p><strong>(a) is wrong:</strong> every button click creates a fresh <code>TrafficLight</code> — state resets to Red every time.</p>
<p><strong>(c) is wrong:</strong> a local variable cannot be seen by other callbacks.</p>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="does-callback-order-matter">Does Callback Order Matter?</h2>
<blockquote>
<p>&quot;The callback must do three things: turn off the active lamp, call <code>app.TL.Advance()</code>, and turn on the new lamp. Which ordering is correct?&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="does-callback-order-matter-1">Does Callback Order Matter?</h2>
<blockquote>
<p>&quot;The callback must do three things: turn off the active lamp, call <code>app.TL.Advance()</code>, and turn on the new lamp. Which ordering is correct?&quot;</p>
</blockquote>
<p><strong>(a)</strong> Any order — the three steps are independent — <em>hands up</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="does-callback-order-matter-2">Does Callback Order Matter?</h2>
<blockquote>
<p>&quot;The callback must do three things: turn off the active lamp, call <code>app.TL.Advance()</code>, and turn on the new lamp. Which ordering is correct?&quot;</p>
</blockquote>
<p><strong>(a)</strong> Any order     <strong>(b)</strong> off → on → advance — <em>hands up</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="does-callback-order-matter-3">Does Callback Order Matter?</h2>
<blockquote>
<p>&quot;The callback must do three things: turn off the active lamp, call <code>app.TL.Advance()</code>, and turn on the new lamp. Which ordering is correct?&quot;</p>
</blockquote>
<p><strong>(a)</strong> Any order     <strong>(b)</strong> off → on → advance     <strong>(c)</strong> off → advance → on — <em>hands up</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="the-callback-3-steps">The Callback: 3 Steps</h2>
<p><img src="media/Fall2025Media/12a_Implementing%20our%20Callback.png" alt="Flowchart showing three sequential blue boxes: Turn off active light → Advance TL State → Turn on next light" /></p>
<p><strong>(c) off → advance → on.</strong> Both lamp operations call <code>GetState()</code> — before <code>Advance()</code> it returns the old state (lamp to turn off); after, the new state (lamp to turn on). Swap the order and the wrong lamp changes.</p>
<p>Avoid a chain of <code>if/else</code> blocks — use <strong>helper methods</strong> to handle which lamp is current.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="the-callback-without-helpers">The Callback Without Helpers</h2>
<pre style="background:#f0f0f0;color:#111;padding:0.5rem 0.8rem;border-radius:4px;border-left:4px solid #bbb;font-size:0.72em;line-height:1.28;overflow:visible;">function AdvanceStateButtonPushed(app, event)
    state = app.TL.GetState();
    <strong style="color:#cc0000;">if state == "Red"</strong>
        app.LampRed.Enable = "off";
    <strong style="color:#cc0000;">elseif state == "Yellow"</strong>
        app.LampYellow.Enable = "off";
    <strong style="color:#cc0000;">elseif state == "Green"</strong>
        app.LampGreen.Enable = "off";
    end
    app.TL.Advance();
    state = app.TL.GetState();
    <strong style="color:#cc0000;">if state == "Red"</strong>
        app.LampRed.Enable = "on";
    <strong style="color:#cc0000;">elseif state == "Yellow"</strong>
        app.LampYellow.Enable = "on";
    <strong style="color:#cc0000;">elseif state == "Green"</strong>
        app.LampGreen.Enable = "on";
    end
end</pre>
<div style="font-size:0.82em; margin-top:0.3rem;">
Same <span style="color:#cc0000; font-weight:bold;">if/else chain appears twice</span> in one callback. Add a Reset button → copy it a third time. Add a fourth state → edit in six places.
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="step-5--helper-methods">Step 5 — Helper Methods</h2>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.5rem 1rem; background: #f9f9f9; font-size: 0.88em; margin: 0.3rem 0;">
A <strong>helper method</strong> is a private method called <em>by your callbacks</em> — never directly by the user. It packages logic that more than one callback would otherwise duplicate.
</div>
<p><img src="media/Fall2025Media/12b_Implementing%20our%20Callback.png" alt="Code showing Helper Methods block with GetCurrLampName, DisableCurrentLamp, EnableCurrentLamp; and Pushbutton Callback calling all three in order" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="complete-app-code">Complete App Code</h2>
<pre style="background:#f0f0f0;color:#111;padding:0.35rem 0.7rem;border-radius:4px;border-left:4px solid #bbb;font-size:0.63em;line-height:1.28;overflow:visible;">properties (Access = private)    <strong style="color:#002855;">% ← you add this block</strong>
    TL
end

methods (Access = private)       <strong style="color:#002855;">% ← ALL your code lives here: startup, callbacks, helpers</strong>

    function startupFcn(app)                               <strong style="color:#555;">% runs once on open</strong>
        app.TL = TrafficLight();
        app.LampRed.Enable    = "on";
        app.LampGreen.Enable  = "off";
        app.LampYellow.Enable = "off";
    end

    function AdvanceStateButtonPushed(app, event)          <strong style="color:#555;">% callback</strong>
        app.DisableCurrentLamp();
        app.TL.Advance();
        app.EnableCurrentLamp();
    end

    function name = GetCurrLampName(app)                   <strong style="color:#cc0000;">% helper</strong>
        name = "Lamp" + app.TL.GetState();
    end

    function DisableCurrentLamp(app)                       <strong style="color:#cc0000;">% helper</strong>
        app.(app.GetCurrLampName()).Enable = "off";
    end

    function EnableCurrentLamp(app)                        <strong style="color:#cc0000;">% helper</strong>
        app.(app.GetCurrLampName()).Enable = "on";
    end

end</pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="run-it">Run It</h2>
<p>Press <strong>F5</strong> (or the Run button). Click <strong>Advance State</strong> several times.</p>
<blockquote>
<p>&quot;Raise your hand when your traffic light successfully changes state.&quot;</p>
</blockquote>
<p><strong>Most common errors:</strong></p>
<ul>
<li><code>TrafficLight</code> not found → <code>.m</code> file is not in the same folder as your <code>.mlapp</code></li>
<li>Component name mismatch → check spelling in the Component Browser</li>
<li>State doesn't change → <code>TrafficLight</code> is not a handle class</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-class="section" data-theme="eng6" lang="en-US" class="section" data-marpit-pagination="43" style="--paginate:true;--class:section;--theme:eng6;" data-marpit-pagination-total="60">
<h1 id="what-we-just-built">What We Just Built</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="the-app-is-a-class">The App Is a Class</h2>
<div style="display:flex; gap:1.5rem; align-items:flex-start;">
<div style="flex:1; background:#f0f0f0; padding:0.6rem 0.8rem; border-left:4px solid #002855; font-size:0.82em;">
<p><strong>Structure</strong></p>
<p><code>classdef App &lt; AppBase</code></p>
<p><code>properties (Access = public)</code><br />
— UI components (auto-generated)</p>
<p><code>properties (Access = private)</code><br />
— your data: <code>TL</code>, <code>analyzer</code>, …</p>
<p><code>methods (Access = private)</code><br />
— <code>startupFcn</code> — runs once on open<br />
— callbacks — run on user actions<br />
— helper methods — called by callbacks</p>
<p><code>end</code></p>
</div>
<div style="flex:2;">
<ul>
<li>App Designer <strong>generates</strong> the public properties and class skeleton</li>
<li>You <strong>add</strong> the private property and write the method bodies</li>
<li>Same <code>classdef</code> / <code>properties</code> / <code>methods</code> as L7 — this is not a new concept</li>
</ul>
<p><strong>L7 connection:</strong> <code>app</code> is an object. <code>app.TL</code> is a property. Calling <code>app.TL.Advance()</code> is the same dot-notation you used with <code>SensorDataAnalyzer</code>.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="45" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="properties-vs-local-variables">Properties vs. Local Variables</h2>
<table>
<thead>
<tr>
<th></th>
<th>Local variable</th>
<th>App property</th>
</tr>
</thead>
<tbody>
<tr>
<td>Lives in...</td>
<td>One callback execution</td>
<td>App object — entire session</td>
</tr>
<tr>
<td>Survives callback return?</td>
<td>No — destroyed</td>
<td>Yes</td>
</tr>
<tr>
<td>Accessible from other callbacks?</td>
<td>No</td>
<td>Yes — <code>app.name</code></td>
</tr>
<tr>
<td>Declared where?</td>
<td>Inside a callback</td>
<td><code>properties</code> block</td>
</tr>
</tbody>
</table>
<p><strong>MP5 direct connection:</strong> <code>app.analyzer</code> stores your <code>SensorDataAnalyzer</code>. Every callback — Start, Plot, Smooth, Reset — reads and writes it. This only works as a <strong>property</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="46" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="thin-callbacks">Thin Callbacks</h2>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.5rem 1rem; background: #f9f9f9; font-size: 0.88em; margin: 0.3rem 0;">
A <strong>thin callback</strong> receives the user event, reads any needed UI values, then immediately delegates to a method on a backend class. It contains no analysis logic — it is wiring, not work. Rule of thumb: <strong>5 lines or fewer</strong>.
</div>
<pre><code class="language-matlab"><span class="hljs-function"><span class="hljs-keyword">function</span> <span class="hljs-title">AdvanceStateButtonPushed</span><span class="hljs-params">(app, event)</span></span>
    app.DisableCurrentLamp();
    app.TL.Advance();
    app.EnableCurrentLamp();
<span class="hljs-keyword">end</span>
</code></pre>
<div style="font-size: 0.82em; margin-top: 0.2rem;">
Good practice: avoid <code>if/else</code> chains that repeat the same lamp logic for every state. Instead, write <strong>helper methods</strong> (<code>DisableCurrentLamp</code>, <code>EnableCurrentLamp</code>) that act on whichever lamp is current. One place to change — zero branches in the callback.
</div>
<span style="color:#cc0000; font-weight:bold;">GUI = interface &nbsp;&nbsp;&nbsp; class = engine</span>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="aside-plotting-inside-an-app">Aside: Plotting Inside an App</h2>
<p><img src="media/Fall2025Media/13_Aside%20Plotting%20with%20GUI%20Apps.png" alt="App Designer showing a frequency slider app; code pane highlights plot(app.UIAxes, x, y) and title(app.UIAxes, titleStr) with app.UIAxes circled" /></p>
<pre><code class="language-matlab"><span class="hljs-built_in">plot</span>(app.UIAxes, x, y);          title(app.UIAxes, <span class="hljs-string">&quot;Signal&quot;</span>);
</code></pre>
<p><code>app.UIAxes</code> is the axes component on the canvas — always pass it explicitly. <code>gca</code> is unreliable inside App Designer.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="debugging-tips">Debugging Tips</h2>
<p><img src="media/Fall2025Media/14DebuggingDevelopment%20Tips.png" alt="MATLAB Command Window showing debugging print statements Active lamp LampGreen and Active lamp LampYellow followed by a red Index exceeds array elements error with stack trace" /></p>
<ul>
<li>All runtime errors and <code>disp</code> output print to the <strong>Command Window</strong></li>
<li>Add <code>disp</code> statements to trace execution — remove before submission</li>
<li>Keep logic in the backend class — isolated methods are easier to debug than long callbacks</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-class="activity" data-theme="eng6" lang="en-US" class="activity" data-marpit-pagination="49" style="--paginate:true;--class:activity;--theme:eng6;" data-marpit-pagination-total="60">
<h1 id="activity-1-add-a-reset-button">Activity 1: Add a Reset Button</h1>
<p><strong>15 min working | 5 min debrief | Teams of 3–4</strong></p>
<p>Starting from your working traffic light app:</p>
<ol>
<li>Add a <strong>&quot;Reset&quot;</strong> button to the canvas — name it <code>ResetButton</code></li>
<li>Add its <code>ButtonPushedFcn</code> callback — it should:
<ul>
<li>Reinitialize <code>app.TL</code> with a new <code>TrafficLight()</code></li>
<li>Set <code>LampRed.Enable = &quot;on&quot;</code>, <code>LampYellow.Enable = &quot;off&quot;</code>, <code>LampGreen.Enable = &quot;off&quot;</code></li>
</ul>
</li>
<li><strong>Verify:</strong> advance 2–3 states, click Reset — light must return to red on every reset</li>
</ol>
<p><em>Use the handout.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="activity-1--debrief">Activity 1 — Debrief</h2>
<blockquote>
<p>&quot;Raise your hand if your Reset button worked correctly on the first try.&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="51" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="activity-1--discussion">Activity 1 — Discussion</h2>
<p><strong>Discussion anchors:</strong></p>
<ul>
<li>What did your Reset callback do that was different from <code>AdvanceStateButtonPushed</code>?</li>
<li>How much code did your Reset callback share with <code>startupFcn</code> — did you duplicate it?</li>
<li>What would break if <code>app.TL</code> were a local variable instead of a property?</li>
</ul>
<p><strong>Teaching point:</strong> Reset and <code>startupFcn</code> share the same initialization logic — which means a clean architecture would extract that into a shared helper method rather than duplicating code. That exact refactoring pattern is how you should design every callback in MP5: if two callbacks do the same thing, extract a helper.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-class="section" data-theme="eng6" lang="en-US" class="section" data-marpit-pagination="52" style="--paginate:true;--class:section;--theme:eng6;" data-marpit-pagination-total="60">
<h1 id="bridge-to-mp5">Bridge to MP5</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="from-trafficlight-to-sensordataanalyzer">From <code>TrafficLight</code> to <code>SensorDataAnalyzer</code></h2>
<p>Same architecture — different backend:</p>
<table>
<thead>
<tr>
<th>Traffic Light App</th>
<th>MP5 Dashboard</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>app.TL</code></td>
<td><code>app.analyzer</code></td>
</tr>
<tr>
<td><code>TrafficLight()</code></td>
<td><code>SensorDataAnalyzer()</code></td>
</tr>
<tr>
<td><code>app.TL.Advance()</code></td>
<td><code>app.analyzer.plot(...)</code></td>
</tr>
<tr>
<td><code>LampRed</code>, <code>LampYellow</code>, <code>LampGreen</code></td>
<td><code>UIAxes</code>, status labels</td>
</tr>
<tr>
<td><code>AdvanceStateButton</code></td>
<td>Plot, Smooth, Integrate, Reset buttons</td>
</tr>
<tr>
<td><code>startupFcn</code> creates <code>TL</code></td>
<td><code>startupFcn</code> or Start button creates <code>analyzer</code></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="plotting-inside-an-app">Plotting Inside an App</h2>
<pre><code class="language-matlab"><span class="hljs-built_in">plot</span>(app.UIAxes, x, y);
title(app.UIAxes, <span class="hljs-string">&quot;Signal&quot;</span>);
</code></pre>
<ul>
<li><code>app.UIAxes</code> is the axes component you dragged onto the canvas</li>
<li><code>gca</code> is unreliable inside App Designer — it may return the wrong axes</li>
<li>Every plotting function that accepts an axes argument takes <code>app.UIAxes</code> as the first input</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="mp5-callback-architecture">MP5 Callback Architecture</h2>
<p>Each button = a <strong>thin callback</strong> that calls one <code>SensorDataAnalyzer</code> method:</p>
<pre><code>User clicks &quot;Plot&quot;
       ↓
PlotButtonPushed  (3–5 lines)
       ↓
app.analyzer.plot(app.UIAxes, app.SignalDropDown.Value)
</code></pre>
<blockquote>
<p>&quot;Raise your hand if you can name what the Start button callback needs to do.&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-class="activity" data-theme="eng6" lang="en-US" class="activity" data-marpit-pagination="56" style="--paginate:true;--class:activity;--theme:eng6;" data-marpit-pagination-total="60">
<h1 id="activity-2-plan-your-mp5-dashboard">Activity 2: Plan Your MP5 Dashboard</h1>
<p><strong>10 min working | 5 min debrief | Teams of 3–4 | Paper only — no MATLAB</strong></p>
<p>Using the MP5 project description:</p>
<ol>
<li><strong>Sketch the layout</strong> — every component: buttons, dropdown, axes, labels</li>
<li><strong>For each button/dropdown:</strong> callback name + one-sentence description</li>
<li><strong>Mark</strong> which callbacks read or write <code>app.analyzer</code></li>
<li><strong>Circle</strong> any data that must persist between callbacks — what property holds it?</li>
</ol>
<p><em>Every team member sketches independently — bring it to lab.</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="activity-2--debrief">Activity 2 — Debrief</h2>
<blockquote>
<p>&quot;Raise your hand if any callback in your sketch is longer than 5 lines.&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="58" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="activity-2--discussion">Activity 2 — Discussion</h2>
<p><strong>Discussion anchors:</strong></p>
<ul>
<li>Where is <code>app.analyzer</code> <em>created</em> — which callback or startup function?</li>
<li>What happens if Plot is clicked before Start? Who detects this — callback or <code>SensorDataAnalyzer</code>?</li>
<li>Which callbacks share data? What property connects them?</li>
</ul>
<p><strong>Teaching point:</strong> Thin callbacks = good architecture. If a callback is 30 lines, the logic belongs in a <code>SensorDataAnalyzer</code> method. The app is the face — <code>SensorDataAnalyzer</code> is the brain.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
<h2 id="what-you-can-do-now--lab-bridge">What You Can Do Now + Lab Bridge</h2>
<p><strong>You can now:</strong></p>
<ul>
<li>Open App Designer and build a layout from components</li>
<li>Write a callback and connect it to a button or dropdown</li>
<li>Store objects as app properties so they persist across callbacks</li>
<li>Pass <code>app.UIAxes</code> to <code>plot()</code> to draw inside the app</li>
</ul>
<p><strong>Before MP5 lab:</strong></p>
<ul>
<li>Rebuild the traffic light app from memory in under 10 minutes</li>
<li>If you can do that, you are ready for Mini-Project 5</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="60">
