<h1 id="strings-as-a-data-type">Strings as a Data Type</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="text-in-matlab">Text in MATLAB</h2>
<pre><code class="language-matlab">name = <span class="hljs-string">&quot;Knoesen&quot;</span>;
tf1  = isstring(name)        <span class="hljs-comment">% true</span>
c    = class(name)           <span class="hljs-comment">% &#x27;string&#x27;</span>
tf2  = isStringScalar(name)  <span class="hljs-comment">% true  — exactly one string, not an array</span>
</code></pre>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.5rem 1rem; background: #f9f9f9; font-size: 0.88em; margin: 0.4rem 0;">
A <strong><span style="color:#cc0000;">string</span></strong> is created with <code>"double quotes"</code>. It stores text as a first-class MATLAB data type.
</div>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.5rem 1rem; background: #f9f9f9; font-size: 0.88em; margin: 0.4rem 0;">
MATLAB's string API is large — <code>isstring</code>, <code>ischar</code>, <code>isStringScalar</code>, <code>iscellstr</code>, and many more type checks; plus dedicated string functions for searching, splitting, formatting, and more. The full list is in MATLAB documentation under <strong>"Text and Strings."</strong> This lecture covers the essential subset.
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="string-arrays">String Arrays</h2>
<p>Strings follow the same array rules as numbers:</p>
<pre><code class="language-matlab">channels = [<span class="hljs-string">&quot;X Accel&quot;</span>, <span class="hljs-string">&quot;Y Accel&quot;</span>, <span class="hljs-string">&quot;Z Accel&quot;</span>];   <span class="hljs-comment">% 1×3 string array</span>
channels(<span class="hljs-number">2</span>)       <span class="hljs-comment">% &quot;Y Accel&quot;</span>
channels(<span class="hljs-keyword">end</span>)     <span class="hljs-comment">% &quot;Z Accel&quot;</span>
channels([<span class="hljs-number">1</span> <span class="hljs-number">3</span>])   <span class="hljs-comment">% [&quot;X Accel&quot;, &quot;Z Accel&quot;]</span>
</code></pre>
<p><em>(MATLAB also accepts spaces as separators — <code>[&quot;X Accel&quot; &quot;Y Accel&quot;]</code> is valid — but always use commas to keep intent unambiguous.)</em></p>
<p>Three different measurements:</p>
<pre><code class="language-matlab">sz = <span class="hljs-built_in">size</span>(channels)          <span class="hljs-comment">% [1 3]   — 1 row, 3 columns (same as numeric)</span>
nl = strlength(channels)     <span class="hljs-comment">% [7 7 7] — characters inside each string</span>
n  = <span class="hljs-built_in">numel</span>(channels)         <span class="hljs-comment">% 3       — how many elements in the array</span>
</code></pre>
<p><span style="color:#cc0000; font-weight:bold;"><code>strlength</code></span>, not <code>length</code> — <code>length(channels)</code> returns 3 (the array dimension), not character counts.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-class="section" data-theme="eng6" lang="en-US" class="section" data-marpit-pagination="6" style="--paginate:true;--class:section;--theme:eng6;" data-marpit-pagination-total="37">
<h1 id="building-and-transforming-strings">Building and Transforming Strings</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="case-and-whitespace">Case and Whitespace</h2>
<pre><code class="language-matlab">s  = <span class="hljs-string">&quot;  Z Accel  &quot;</span>;
lo = lower(s)               <span class="hljs-comment">% &quot;  z accel  &quot;</span>
up = upper(s)               <span class="hljs-comment">% &quot;  Z ACCEL  &quot;</span>
tr = strtrim(s)             <span class="hljs-comment">% &quot;Z Accel&quot;</span>
</code></pre>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.4rem 0.8rem; background: #f9f9f9; font-size: 0.82em; margin: 0.3rem 0;">
<strong>Whitespace</strong> — any character that renders as blank: regular space <code>' '</code>, tab <code>'\t'</code>, newline <code>'\n'</code>. <code>strtrim</code> removes whitespace from the <strong>leading and trailing ends only</strong> — whitespace inside the string is unchanged. Normalizing internal whitespace requires <code>replace</code> — covered in the Replacing Content slide.
</div>
<p>Inspect individual characters:</p>
<pre><code class="language-matlab">t   = <span class="hljs-string">&quot;Lab3A&quot;</span>;
tfl = isletter(t)              <span class="hljs-comment">% [1 1 1 0 1]  — true at letter positions</span>
tfs = isspace(t)               <span class="hljs-comment">% [0 0 0 0 0]  — true at space positions</span>
tfd = isstrprop(t, <span class="hljs-string">&quot;digit&quot;</span>)    <span class="hljs-comment">% [0 0 0 1 0]  — true at digit position</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="concatenation">Concatenation</h2>
<pre><code class="language-matlab">sensor = <span class="hljs-string">&quot;IMU&quot;</span>;
run    = <span class="hljs-string">&quot;03&quot;</span>;

s1 = sensor + <span class="hljs-string">&quot;_&quot;</span> + run          <span class="hljs-comment">% &quot;IMU_03&quot;   (+ operator)</span>
s2 = append(sensor, <span class="hljs-string">&quot;_&quot;</span>, run)    <span class="hljs-comment">% &quot;IMU_03&quot;   (explicit — handles arrays too)</span>
</code></pre>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.5rem 1rem; background: #f9f9f9; font-size: 0.88em; margin: 0.4rem 0;">
<code>strcat</code> also concatenates but has a quirk with char vectors — use <code>+</code> or <code>append</code> for predictable results with strings. <em>Char vectors introduced in the Comparing and Searching section.</em>
<br /><br />
Mixing numbers into strings: <code>"Samples: " + n</code> works, but MATLAB chooses the number format — use <code>num2str(n)</code> for controlled output (see the Numbers ↔ Text slide).
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="numbers-%E2%86%94-text">Numbers <img class="emoji" draggable="false" alt="↔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2194.svg" data-marp-twemoji=""/> Text</h2>
<pre><code class="language-matlab">n = <span class="hljs-number">500</span>;   dt = <span class="hljs-number">0.01</span>;   duration = n * dt;   <span class="hljs-comment">% 5.0</span>

<span class="hljs-comment">% Number → text</span>
raw   = <span class="hljs-string">&quot;Duration: &quot;</span> + num2str(duration)                  <span class="hljs-comment">% &quot;Duration: 5&quot;</span>
label = <span class="hljs-string">&quot;Duration: &quot;</span> + num2str(duration, <span class="hljs-string">&quot;%.1f&quot;</span>) + <span class="hljs-string">&quot; s&quot;</span>  <span class="hljs-comment">% &quot;Duration: 5.0 s&quot;</span>
fmt   = sprintf(<span class="hljs-string">&quot;Run %02d of %d&quot;</span>, <span class="hljs-number">3</span>, <span class="hljs-number">10</span>)                 <span class="hljs-comment">% &quot;Run 03 of 10&quot;</span>

<span class="hljs-comment">% Text → number</span>
val1 = str2double(<span class="hljs-string">&quot;3.14&quot;</span>)    <span class="hljs-comment">% 3.1400</span>
val2 = str2double(<span class="hljs-string">&quot;abc&quot;</span>)     <span class="hljs-comment">% NaN    — invalid input returns NaN, not an error</span>
</code></pre>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.5rem 1rem; background: #f9f9f9; font-size: 0.85em; margin: 0.3rem 0;">
<strong>Format codes</strong> — <code>%</code> marks the conversion, followed by optional width/precision and a type character:<br />
<code>%d</code> integer &nbsp;·&nbsp; <code>%f</code> fixed-point &nbsp;·&nbsp; <code>%.1f</code> 1 decimal place &nbsp;·&nbsp; <code>%.2f</code> 2 decimal places &nbsp;·&nbsp; <code>%e</code> scientific &nbsp;·&nbsp; <code>%02d</code> integer padded to 2 digits
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="activity" data-theme="eng6" lang="en-US" class="activity" data-marpit-pagination="10" style="--paginate:true;--class:activity;--theme:eng6;" data-marpit-pagination-total="37">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">

<h2 id="activity-1--discussion">Activity 1 — Discussion</h2>
<p><strong>Discussion anchors:</strong></p>
<ul>
<li>Where did <code>num2str</code> format codes matter — what happened without <code>&quot;%.1f&quot;</code>?</li>
<li>Which concatenation pattern did your team use — <code>+</code>, <code>append</code>, or <code>sprintf</code>? Is there a case where one is clearly better?</li>
<li>What problem does <code>strtrim</code> in <code>sensorLabel</code> prevent?</li>
</ul>
<p><strong>Teaching point:</strong> Formatting is a contract between your code and the human reading the output. A missing decimal place or extra space is not cosmetic — it is a broken specification.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-class="section" data-theme="eng6" lang="en-US" class="section" data-marpit-pagination="13" style="--paginate:true;--class:section;--theme:eng6;" data-marpit-pagination-total="37">
<h1 id="comparing-and-searching">Comparing and Searching</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="char--what-it-is-and-when-youll-encounter-it">char — What It Is and When You'll Encounter It</h2>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.5rem 1rem; background: #f9f9f9; font-size: 0.88em; margin: 0.3rem 0;">
<strong>ASCII</strong> (American Standard Code for Information Interchange) — assigns a number to every character: <code>'A'</code> = 65, <code>'a'</code> = 97, <code>'0'</code> = 48, space = 32. A <strong><span style="color:#cc0000;">char vector</span></strong> (<code>'single quotes'</code>) stores text as a numeric array of these codes — arithmetic on char operates on the numbers, not the letters.
</div>
<p><strong>Where you will see char:</strong> documentation, older textbooks, some built-in return values, and legacy code</p>
<p><strong>When char makes sense to write:</strong></p>
<ul>
<li>ASCII arithmetic: <code>'A' + 1</code> → <code>66</code> → <code>char(66)</code> → <code>'B'</code></li>
<li>Interfacing with an older function that explicitly requires char input</li>
</ul>
<p>Write new code with <code>&quot;double quotes&quot;</code>. If you receive a char, convert it to string with <code>string(c)</code> — char in, string out. String functions such as <code>strcmp</code>, <code>contains</code>, and <code>strtrim</code> accept both types.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="15" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="char-arithmetic-in-action">char Arithmetic in Action</h2>
<pre style="background:#f0f0f0; color:#111; padding:0.7rem 1rem; border-radius:4px; border-left:4px solid #bbb; font-size:0.82rem; line-height:1.45; overflow:visible;">function encoded = shiftLetters(s, n)
% Shift every lowercase letter n positions forward in the alphabet (wraps a–z).
%
% Inputs:
%   s - 1x1  string  input text
%   n - 1x1  double  number of positions to shift
%
% Outputs:
%   encoded - 1x1  string  encoded text
<strong style="color:#cc0000;">c       = char(s);</strong>                           % string → char for arithmetic
mask    = c &gt;= 'a' &amp; c &lt;= 'z';
c(mask) = char(mod(c(mask) - 'a' + n, 26) + 'a'); % shift each letter
<strong style="color:#cc0000;">encoded = string(c);</strong>                         % char → string to return
end</pre>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.4rem 0.8rem; background: #f9f9f9; font-size: 0.82em; margin: 0.3rem 0;">
<code>string</code> arithmetic (<code>s + n</code>) shifts array elements, not letters. <code>char(s)</code> exposes ASCII codes — <code>c(mask) - 'a' + n</code> shifts each letter by position, and <code>mod(..., 26)</code> wraps past <code>'z'</code> back to <code>'a'</code>. Return to <code>string</code> with <code>string(c)</code>.
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="16" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="comparing-text-with">Comparing Text with <code>==</code></h2>
<p><em>Applying <code>==</code> to a char vector — to reveal a surprise:</em></p>
<pre><code class="language-matlab">a = <span class="hljs-string">&#x27;hello&#x27;</span>;
b = <span class="hljs-string">&#x27;hello&#x27;</span>;
result = (a == b)
</code></pre>
<blockquote>
<p>&quot;What does <code>result</code> contain?&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="comparing-text-with-1">Comparing Text with <code>==</code></h2>
<p><em>Applying <code>==</code> to a char vector — to reveal a surprise:</em></p>
<pre><code class="language-matlab">a = <span class="hljs-string">&#x27;hello&#x27;</span>;
b = <span class="hljs-string">&#x27;hello&#x27;</span>;
result = (a == b)
</code></pre>
<blockquote>
<p>&quot;What does <code>result</code> contain?&quot;</p>
</blockquote>
<p><strong>(a)</strong> <code>true</code> — one logical value — <em>hands up</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="comparing-text-with-2">Comparing Text with <code>==</code></h2>
<p><em>Applying <code>==</code> to a char vector — to reveal a surprise:</em></p>
<pre><code class="language-matlab">a = <span class="hljs-string">&#x27;hello&#x27;</span>;
b = <span class="hljs-string">&#x27;hello&#x27;</span>;
result = (a == b)
</code></pre>
<blockquote>
<p>&quot;What does <code>result</code> contain?&quot;</p>
</blockquote>
<p><strong>(a)</strong> <code>true</code> — one value      <strong>(b)</strong> <code>[1 1 1 1 1]</code> — a logical array — <em>hands up</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="use-strcmp-not">Use <code>strcmp</code>, Not <code>==</code></h2>
<p>Because char stores text as <strong>ASCII numbers</strong>, <code>==</code> compares each position separately — the result is an array, not a yes/no:</p>
<pre><code class="language-matlab">a = <span class="hljs-string">&#x27;hello&#x27;</span>;   b = <span class="hljs-string">&#x27;hello&#x27;</span>;
result = (a == b)   <span class="hljs-comment">% [1 1 1 1 1]  — five answers, not one</span>

<span class="hljs-keyword">if</span> (a == b)         <span class="hljs-comment">% MATLAB evaluates: if [1 1 1 1 1]</span>
<span class="hljs-keyword">end</span>                 <span class="hljs-comment">% only true when ALL positions match AND lengths are equal</span>
                    <span class="hljs-comment">% throws an error when lengths differ</span>
</code></pre>
<p>Use <span style="color:#cc0000; font-weight:bold;"><code>strcmp</code></span> — it asks &quot;are these the same text?&quot; and works safely on <strong>both</strong> char and string:</p>
<pre><code class="language-matlab">tf = strcmp(a, b)   <span class="hljs-comment">% true</span>
</code></pre>
<p>For string type (<code>&quot;double quotes&quot;</code>), <code>==</code> does return a scalar <code>true</code>/<code>false</code> — but <code>strcmp</code> is the safe habit regardless of type.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="exact-comparison">Exact Comparison</h2>
<pre><code class="language-matlab">sensor = <span class="hljs-string">&quot;Z Accel&quot;</span>;

tf1 = strcmp(sensor, <span class="hljs-string">&quot;Z Accel&quot;</span>)     <span class="hljs-comment">% true   exact, case-sensitive</span>
tf2 = strcmpi(sensor, <span class="hljs-string">&quot;z accel&quot;</span>)    <span class="hljs-comment">% true   exact, ignore case</span>
tf3 = matches(sensor, <span class="hljs-string">&quot;Z Accel&quot;</span>)    <span class="hljs-comment">% true   scales to arrays and pattern lists</span>
</code></pre>
<div style="display:flex; gap:1.5rem; align-items:flex-start; margin-top:0.4rem;">
<div style="flex:1; background:#f0f0f0; padding:0.6rem 0.8rem; border-left:4px solid #002855; font-size:0.82em;">
<p><strong>Choosing:</strong><br />
<code>strcmp</code> — standard, always safe<br />
<code>strcmpi</code> — user input or file data<br />
<code>matches</code> — multiple patterns at once</p>
</div>
<div style="flex:1;">
<pre><code class="language-matlab"><span class="hljs-comment">% matches against a list:</span>
s  = <span class="hljs-string">&quot;Z Accel&quot;</span>;
tf = matches(s, [<span class="hljs-string">&quot;Z Accel&quot;</span>, <span class="hljs-string">&quot;Z Axis&quot;</span>])
<span class="hljs-comment">% true</span>
</code></pre>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="partial-matching">Partial Matching</h2>
<pre><code class="language-matlab">label = <span class="hljs-string">&quot;X Axis Acceleration&quot;</span>;

tf1 = contains(label, <span class="hljs-string">&quot;Axis&quot;</span>)                     <span class="hljs-comment">% true</span>
tf2 = contains(label, <span class="hljs-string">&quot;axis&quot;</span>, IgnoreCase=<span class="hljs-built_in">true</span>)    <span class="hljs-comment">% true</span>
tf3 = startsWith(label, <span class="hljs-string">&quot;X&quot;</span>)                      <span class="hljs-comment">% true</span>
tf4 = endsWith(label, <span class="hljs-string">&quot;tion&quot;</span>)                     <span class="hljs-comment">% true</span>
</code></pre>
<p>All four work on string arrays — the result has the same shape as the input:</p>
<pre><code class="language-matlab">channels = [<span class="hljs-string">&quot;X Accel&quot;</span>, <span class="hljs-string">&quot;Y Accel&quot;</span>, <span class="hljs-string">&quot;Z Accel&quot;</span>, <span class="hljs-string">&quot;Resultant&quot;</span>];
mask = contains(channels, <span class="hljs-string">&quot;Accel&quot;</span>)   <span class="hljs-comment">% [true true true false]</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="finding-positions">Finding Positions</h2>
<pre><code class="language-matlab">header = <span class="hljs-string">&quot;timestamp,X_accel,Y_accel,Z_accel&quot;</span>;
idx    = strfind(header, <span class="hljs-string">&quot;,&quot;</span>)   <span class="hljs-comment">% [10 18 26]  — position of every comma</span>
</code></pre>
<p><code>strfind</code> returns indices — use it when you need to know <em>where</em> something appears, not just <em>whether</em> it appears.</p>
<p>For most filtering tasks <code>contains</code> / <code>startsWith</code> / <code>endsWith</code> are more readable. Reach for <code>strfind</code> when the position itself matters.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-class="activity" data-theme="eng6" lang="en-US" class="activity" data-marpit-pagination="23" style="--paginate:true;--class:activity;--theme:eng6;" data-marpit-pagination-total="37">
<h1 id="activity-2-char-indexing">Activity 2: char Indexing</h1>
<p><strong>Personal | 8 min — do not discuss yet.</strong></p>
<p>Write <code>isPalindrome(s)</code> — return <code>true</code> if <code>s</code> reads the same forwards and backwards, ignoring case.</p>
<p>Before writing the function body: predict the result for <code>&quot;racecar&quot;</code>, <code>&quot;hello&quot;</code>, and <code>&quot;Level&quot;</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="activity-2--debrief">Activity 2 — Debrief</h2>
<blockquote>
<p>&quot;Raise your hand if <code>isPalindrome(&quot;Level&quot;)</code> returned the correct answer on the first try.&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="activity-2--discussion">Activity 2 — Discussion</h2>
<p><strong>Discussion anchors:</strong></p>
<ul>
<li>What does <code>c(end:-1:1)</code> return — and why does this work on a char vector but not directly on a string scalar?</li>
<li>Why apply <code>lower</code> before converting to char, not after reversing?</li>
<li>What would <code>s == s(end:-1:1)</code> do if <code>s</code> were a string instead of a char vector?</li>
</ul>
<p><strong>Teaching point:</strong> A char vector is a numeric array with a character display — <code>c(end:-1:1)</code> is the same reversal idiom used on any array. String scalars do not support element-by-element subscripting the same way, which is exactly why the <code>char</code> conversion is the right tool here.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-class="section" data-theme="eng6" lang="en-US" class="section" data-marpit-pagination="26" style="--paginate:true;--class:section;--theme:eng6;" data-marpit-pagination-total="37">
<h1 id="extracting-replacing-and-splitting">Extracting, Replacing, and Splitting</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="extracting-parts">Extracting Parts</h2>
<p><code>extractBefore</code>, <code>extractAfter</code>, and <code>extractBetween</code> locate a boundary pattern in a string and return the text on one side — or between two boundaries. Use them to pull structured information out of filenames, header fields, or data labels.</p>
<pre><code class="language-matlab">filename = <span class="hljs-string">&quot;sensor_2026-04-25_run03.csv&quot;</span>;

before  = extractBefore(filename, <span class="hljs-string">&quot;_run&quot;</span>)                <span class="hljs-comment">% &quot;sensor_2026-04-25&quot;</span>
after   = extractAfter(filename, <span class="hljs-string">&quot;sensor_&quot;</span>)              <span class="hljs-comment">% &quot;2026-04-25_run03.csv&quot;</span>
between = extractBetween(filename, <span class="hljs-string">&quot;sensor_&quot;</span>, <span class="hljs-string">&quot;_run03&quot;</span>)  <span class="hljs-comment">% &quot;2026-04-25&quot;</span>
</code></pre>
<p>The result type matches the input; all three accept string arrays and process each element.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="replacing-content">Replacing Content</h2>
<p><code>replace</code> substitutes every occurrence of a pattern with new text. Use it to normalize inconsistent separators, fix encoding artifacts, or clean up whitespace. <code>strrep</code> does the same and works on both char and string.</p>
<pre><code class="language-matlab">raw = <span class="hljs-string">&quot;X-Accel&quot;</span>;
s1  = replace(raw, <span class="hljs-string">&quot;-&quot;</span>, <span class="hljs-string">&quot; &quot;</span>)    <span class="hljs-comment">% &quot;X Accel&quot;</span>
s2  = strrep(raw, <span class="hljs-string">&quot;-&quot;</span>, <span class="hljs-string">&quot;_&quot;</span>)     <span class="hljs-comment">% &quot;X_Accel&quot;</span>
</code></pre>
<p>Replace with <code>&quot;&quot;</code> to remove text, or fix internal whitespace:</p>
<pre><code class="language-matlab">s3 = replace(<span class="hljs-string">&quot;Z  Accel&quot;</span>, <span class="hljs-string">&quot;  &quot;</span>, <span class="hljs-string">&quot; &quot;</span>)             <span class="hljs-comment">% &quot;Z Accel&quot;   double→single space</span>
s4 = replace(<span class="hljs-string">&quot;remove  extra  spaces&quot;</span>, <span class="hljs-string">&quot;  &quot;</span>, <span class="hljs-string">&quot; &quot;</span>) <span class="hljs-comment">% &quot;remove extra spaces&quot;</span>
</code></pre>
<p><code>replace</code> works element-wise on string arrays.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="splitting-and-joining">Splitting and Joining</h2>
<p><code>split</code> divides a string at a delimiter and returns the pieces as a string array — the inverse of concatenation. <code>join</code> re-assembles a string array into one string with a chosen separator.</p>
<pre><code class="language-matlab">header = <span class="hljs-string">&quot;timestamp,X_accel,Y_accel,Z_accel&quot;</span>;
cols   = split(header, <span class="hljs-string">&quot;,&quot;</span>)
<span class="hljs-comment">% [&quot;timestamp&quot;; &quot;X_accel&quot;; &quot;Y_accel&quot;; &quot;Z_accel&quot;]  — column vector</span>

n      = <span class="hljs-built_in">numel</span>(cols)         <span class="hljs-comment">% 4</span>

joined = join(cols, <span class="hljs-string">&quot; | &quot;</span>)   <span class="hljs-comment">% &quot;timestamp | X_accel | Y_accel | Z_accel&quot;</span>
</code></pre>
<p><code>split</code> returns a <strong>column</strong> vector of strings by default. Transpose with <code>'</code> when a row is needed.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-class="activity" data-theme="eng6" lang="en-US" class="activity" data-marpit-pagination="30" style="--paginate:true;--class:activity;--theme:eng6;" data-marpit-pagination-total="37">
<h1 id="activity-3-parsing-structured-text">Activity 3: Parsing Structured Text</h1>
<p><strong>Teams of 3–4 | 20 min working + 5 min debrief</strong></p>
<p>Extract and normalize information embedded in structured text strings.</p>
<blockquote>
<p>Open the Handout — Activity 3. On your own first — write your predicted output before discussing with your team.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="activity-3--debrief">Activity 3 — Debrief</h2>
<blockquote>
<p>&quot;Raise your hand if your date extraction gave a different result than expected on the first try.&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="activity-3--discussion">Activity 3 — Discussion</h2>
<p><strong>Discussion anchors:</strong></p>
<ul>
<li>When you <code>split</code> the header string, what type and shape is the result?</li>
<li>In what order did you apply <code>lower</code> and <code>replace</code> for normalization — and why does order matter?</li>
<li>What breaks if the delimiter in the filename changes from <code>_</code> to <code>-</code>?</li>
</ul>
<p><strong>Teaching point:</strong> Parsing converts brittle text into structured data. Every <code>split</code> and <code>extractBetween</code> assumes a fixed format. If the format changes, the parser breaks. Good parsers make their format assumptions explicit.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="when-string-operations-stack-up">When String Operations Stack Up</h2>
<p>Real CSV header — column names are inconsistent, units attached, separators vary:</p>
<pre><code>&quot;Timestamp(s), X_Accel[m/s2], Y-Accel [m/s2], z accel(m/s2)&quot;
</code></pre>
<p>Goal: <code>[&quot;timestamp&quot;, &quot;x_accel&quot;, &quot;y_accel&quot;, &quot;z_accel&quot;]</code></p>
<pre><code class="language-matlab">raw  = <span class="hljs-string">&quot;Timestamp(s), X_Accel[m/s2], Y-Accel [m/s2], z accel(m/s2)&quot;</span>;

cols = strtrim(split(raw, <span class="hljs-string">&quot;,&quot;</span>));                              <span class="hljs-comment">% split fields</span>
cols = lower(cols);                                           <span class="hljs-comment">% lowercase</span>
cols = replace(cols, [<span class="hljs-string">&quot;(s)&quot;</span>, <span class="hljs-string">&quot;(m/s2)&quot;</span>, <span class="hljs-string">&quot;[m/s2]&quot;</span>], <span class="hljs-string">&quot;&quot;</span>);         <span class="hljs-comment">% strip known units</span>
cols = strtrim(replace(replace(cols, <span class="hljs-string">&quot;-&quot;</span>, <span class="hljs-string">&quot;_&quot;</span>), <span class="hljs-string">&quot; &quot;</span>, <span class="hljs-string">&quot;_&quot;</span>));  <span class="hljs-comment">% fix separators</span>
<span class="hljs-comment">% → [&quot;timestamp&quot;, &quot;x_accel&quot;, &quot;y_accel&quot;, &quot;z_accel&quot;]</span>
</code></pre>
<p>Every function here is from today. It works — for this exact set of unit formats. What if someone writes <code>[m/s^2]</code> instead? Or <code>(M/S²)</code>? The <code>replace</code> list grows with every new variant.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="34" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="beyond-replace--regular-expressions">Beyond <code>replace</code> — Regular Expressions</h2>
<p><code>replace</code> handles <em>known</em> patterns. Real-world text has <em>unknown</em> patterns — the next level up is regex.</p>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.5rem 1rem; background: #f9f9f9; font-size: 0.88em; margin: 0.3rem 0;">
A <strong><span style="color:#cc0000;">regular expression</span></strong> is a pattern-matching mini-language built into nearly every programming environment. One pattern replaces dozens of <code>replace</code> calls. In MATLAB: <code>regexp</code> finds matches; <code>regexprep</code> substitutes them.
</div>
<p><strong>Live demo — AI writes the regex:</strong></p>
<p>LSM6DS3 (ST) — the IMU family used in iPhones. Paste from View Source on <code>st.com/en/mems-and-sensors/lsm6ds3.html</code>:</p>
<pre><code class="language-matlab"><span class="hljs-comment">% st.com/en/mems-and-sensors/lsm6ds3.html → View Source → copy table rows</span>
html = <span class="hljs-string">&quot;&lt;td&gt;Accelerometer full-scale range: ±2 g, ±4 g, ±8 g, ±16 g&lt;/td&gt;&quot;</span> + ...
       <span class="hljs-string">&quot;&lt;td&gt;Gyroscope full-scale range: ±125, ±250, ±500, ±1000, ±2000 dps&lt;/td&gt;&quot;</span> + ...
       <span class="hljs-string">&quot;&lt;td&gt;Supply voltage: 1.71 V – 3.6 V&lt;/td&gt;&quot;</span>;
</code></pre>
<p><em>Prompt to AI:</em> &quot;Write MATLAB code to extract all numerical measurement values with units from this HTML string&quot;</p>
<p><strong>Regular expressions are not part of this course.</strong> Two things to know:</p>
<ul>
<li>They exist, they are powerful, and you will encounter them in practice</li>
<li><strong>AI writes excellent regex</strong> — describe what you need in plain English; it returns working code and explains every part of the pattern</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
<h2 id="what-you-can-do-now--lab-bridge">What You Can Do Now + Lab Bridge</h2>
<p><strong>You can now:</strong></p>
<ul>
<li>Create and index string arrays · measure with <code>strlength</code> and <code>numel</code></li>
<li>Transform text: <code>lower</code>, <code>upper</code>, <code>strtrim</code>, <code>isletter</code>, <code>isspace</code></li>
<li>Concatenate with <code>+</code> and <code>append</code> · format numbers with <code>num2str</code> and <code>sprintf</code></li>
<li>Compare with <code>strcmp</code>, <code>strcmpi</code>, <code>matches</code>, <code>contains</code>, <code>startsWith</code>, <code>endsWith</code></li>
<li>Extract, replace, and split structured text with <code>extractBetween</code>, <code>replace</code>, <code>split</code></li>
<li>Convert with <code>char(s)</code> for ASCII arithmetic, <code>string(c)</code> to return to string</li>
</ul>
<p><strong>In MP5:</strong> dropdown values are strings — <code>strcmp</code> routes callbacks; <code>+</code> and <code>num2str</code> build axis labels and titles; <code>split</code> and <code>contains</code> parse any data file that has a header row.</p>
<p><strong>Next lecture:</strong> Loops — strings and loops together enable batch processing of multiple files and datasets.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="37">
