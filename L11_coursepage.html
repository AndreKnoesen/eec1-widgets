</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-class="section" data-theme="eng6" lang="en-US" class="section" data-marpit-pagination="5" style="--paginate:true;--class:section;--theme:eng6;" data-marpit-pagination-total="51">
<h1 id="while-loops">While Loops</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="what-is-a-loop-the-core-idea">What Is a Loop? (The Core Idea)</h2>
<p>Without a loop, processing 1,000 samples requires writing the same line 1,000 times:</p>
<pre><code class="language-matlab">process(data(<span class="hljs-number">1</span>));
process(data(<span class="hljs-number">2</span>));
process(data(<span class="hljs-number">3</span>));
<span class="hljs-comment">% ... 997 more lines</span>
</code></pre>
<p>With a loop — one block, repeated as many times as needed:</p>
<pre><code class="language-matlab"><span class="hljs-keyword">for</span> <span class="hljs-built_in">i</span> = <span class="hljs-number">1</span>:<span class="hljs-number">1000</span>
    process(data(<span class="hljs-built_in">i</span>));
<span class="hljs-keyword">end</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="while-loop-anatomy-3">While Loop: Anatomy</h2>
<pre><code class="language-matlab">n = <span class="hljs-number">0</span>;                    <span class="hljs-comment">% initialize before the loop</span>
<span class="hljs-keyword">while</span> n &lt; <span class="hljs-number">5</span>               <span class="hljs-comment">% condition checked at top of each iteration</span>
    <span class="hljs-built_in">disp</span>(n);              <span class="hljs-comment">% body executes if condition is true</span>
    n = n + <span class="hljs-number">1</span>;            <span class="hljs-comment">% update — must bring condition closer to false</span>
<span class="hljs-keyword">end</span>
<span class="hljs-built_in">disp</span>(<span class="hljs-string">&#x27;done&#x27;</span>);
</code></pre>
<blockquote>
<p>&quot;What does this print?&quot;</p>
</blockquote>
<p><strong>(a)</strong> <code>0 1 2 3 4</code>      <strong>(b)</strong> <code>0 1 2 3 4 5</code>      <strong>(c)</strong> infinite output — <em>hands up</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="condition-check-before-every-iteration">Condition Check: Before Every Iteration</h2>
<pre><code class="language-matlab">n = <span class="hljs-number">0</span>;
<span class="hljs-keyword">while</span> n &lt; <span class="hljs-number">5</span>               <span class="hljs-comment">% ← checked here, before disp runs</span>
    <span class="hljs-built_in">disp</span>(n);
    n = n + <span class="hljs-number">1</span>;
<span class="hljs-keyword">end</span>
<span class="hljs-built_in">disp</span>(<span class="hljs-string">&#x27;done&#x27;</span>);
</code></pre>
<p>Answer: <strong>(a)</strong> — prints <code>0 1 2 3 4</code>, then <code>done</code></p>
<ul>
<li>When <code>n = 4</code>: condition <code>4 &lt; 5</code> is true → body runs → <code>n</code> becomes 5</li>
<li>When <code>n = 5</code>: condition <code>5 &lt; 5</code> is <strong>false</strong> → loop exits → 5 is <strong>never printed</strong></li>
<li><strong>Key:</strong> the condition is checked <strong>before</strong> the body runs, every time</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="the-infinite-loop">The Infinite Loop</h2>
<pre><code class="language-matlab">n = <span class="hljs-number">0</span>;
<span class="hljs-keyword">while</span> n &lt; <span class="hljs-number">5</span>
    <span class="hljs-built_in">disp</span>(n);
    <span class="hljs-comment">% forgot n = n + 1</span>
<span class="hljs-keyword">end</span>
</code></pre>
<ul>
<li>Missing the update → condition never becomes false → runs forever</li>
<li><span style="color:#cc0000; font-weight:bold;">Ctrl+C</span> stops a runaway loop in MATLAB</li>
</ul>
<p><strong>Safety counter pattern — always add a maximum iteration guard:</strong></p>
<pre><code class="language-matlab">n = <span class="hljs-number">0</span>;  max_iter = <span class="hljs-number">1000</span>;  iter = <span class="hljs-number">0</span>;
<span class="hljs-keyword">while</span> n &lt; <span class="hljs-number">5</span> &amp;&amp; iter &lt; max_iter
    n = n + <span class="hljs-number">1</span>;
    iter = iter + <span class="hljs-number">1</span>;
<span class="hljs-keyword">end</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="real-scenario-log-until-n-samples">Real Scenario: Log Until N Samples</h2>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.4rem 0.8rem; background: #f9f9f9; font-size: 0.82em; margin: 0 0 0.4rem 0;">
<strong><code>mobiledev</code></strong> — MATLAB object that connects to your smartphone running MATLAB Mobile (used in MP3–MP5). <strong><code>accellog(m)</code></strong> retrieves the accelerometer samples the phone has logged so far — each row is one time-stamped <em>[t, x, y, z]</em> reading. The row count grows as the phone continues logging.
</div>
<pre><code class="language-matlab">m = mobiledev;
m.Logging = <span class="hljs-number">1</span>;           <span class="hljs-comment">% phone starts recording accelerometer data</span>
target = <span class="hljs-number">100</span>;

<span class="hljs-keyword">while</span> <span class="hljs-built_in">size</span>(accellog(m), <span class="hljs-number">1</span>) &lt; target   <span class="hljs-comment">% rows logged so far &lt; 100?</span>
    pause(<span class="hljs-number">0.1</span>);          <span class="hljs-comment">% wait 100 ms, then check again</span>
<span class="hljs-keyword">end</span>

m.Logging = <span class="hljs-number">0</span>;           <span class="hljs-comment">% stop recording</span>
data = accellog(m);      <span class="hljs-comment">% retrieve the full dataset</span>
</code></pre>
<ul>
<li>The sample count grows over time — the loop keeps checking until enough rows arrive</li>
<li><code>for</code> would require knowing the final count upfront — impossible in real-time logging</li>
<li><strong>Lab connection:</strong> in the Group Project lab session, use this pattern to collect data until you have enough samples for each activity</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="the-counting-pattern">The Counting Pattern</h2>
<pre><code class="language-matlab">count = <span class="hljs-number">0</span>;               <span class="hljs-comment">% initialize outside the loop</span>
<span class="hljs-keyword">while</span> some_condition
    <span class="hljs-comment">% ... do work ...</span>
    count = count + <span class="hljs-number">1</span>;   <span class="hljs-comment">% appears in almost every loop</span>
<span class="hljs-keyword">end</span>
fprintf(<span class="hljs-string">&quot;Processed %d items\n&quot;</span>, count);
</code></pre>
<ul>
<li><code>count = count + 1</code> is the most common single line in all of programming</li>
<li>Works for any counter: samples collected, events detected, iterations elapsed</li>
</ul>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.5rem 1rem; background: #f9f9f9; font-size: 0.88em; margin: 0.4rem 0;">
MATLAB does <strong>not</strong> have <code>n++</code> — always write <code>n = n + 1</code>. This trips up everyone arriving from C or Python.
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="19" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="while-loop-check-your-model-4">While Loop: Check Your Model</h2>
<pre><code class="language-matlab">k = <span class="hljs-number">1</span>;
<span class="hljs-keyword">while</span> k &lt; <span class="hljs-number">10</span>
    k = k * <span class="hljs-number">2</span>;
<span class="hljs-keyword">end</span>
<span class="hljs-built_in">disp</span>(k)
</code></pre>
<blockquote>
<p>&quot;What does <code>k</code> equal after this runs?&quot;</p>
</blockquote>
<p><strong>(a)</strong> 8      <strong>(b)</strong> 16      <strong>(c)</strong> 10      <strong>(d)</strong> infinite — <em>hands up</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="20" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="reading-a-loop-trace">Reading a Loop Trace</h2>
<pre><code class="language-matlab">k = <span class="hljs-number">1</span>;
<span class="hljs-keyword">while</span> k &lt; <span class="hljs-number">10</span>
    k = k * <span class="hljs-number">2</span>;
<span class="hljs-keyword">end</span>
<span class="hljs-built_in">disp</span>(k)
</code></pre>
<p>Answer: <strong>(b)</strong> — <code>k = 16</code></p>
<table>
<thead>
<tr>
<th>k before check</th>
<th><code>k &lt; 10</code>?</th>
<th>body runs?</th>
<th>k after</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td>true</td>
<td>yes</td>
<td>2</td>
</tr>
<tr>
<td>2</td>
<td>true</td>
<td>yes</td>
<td>4</td>
</tr>
<tr>
<td>4</td>
<td>true</td>
<td>yes</td>
<td>8</td>
</tr>
<tr>
<td>8</td>
<td>true</td>
<td>yes</td>
<td>16</td>
</tr>
<tr>
<td>16</td>
<td><strong>false</strong></td>
<td><strong>no</strong></td>
<td>—</td>
</tr>
</tbody>
</table>
<p><code>k = 16</code> is the first value that <strong>fails</strong> the condition — the loop exits with <code>k = 16</code></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-class="section" data-theme="eng6" lang="en-US" class="section" data-marpit-pagination="21" style="--paginate:true;--class:section;--theme:eng6;" data-marpit-pagination-total="51">
<h1 id="for-loops">For Loops</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="for-loop-the-counted-iteration">For Loop: The Counted Iteration</h2>
<pre><code class="language-matlab"><span class="hljs-keyword">for</span> <span class="hljs-built_in">i</span> = <span class="hljs-number">1</span>:<span class="hljs-number">5</span>
    <span class="hljs-built_in">disp</span>(<span class="hljs-built_in">i</span>);
<span class="hljs-keyword">end</span>
</code></pre>
<p><code>for</code> is a while loop where the counter is managed automatically:</p>
<pre><code class="language-matlab"><span class="hljs-comment">% Equivalent while loop:</span>
<span class="hljs-built_in">i</span> = <span class="hljs-number">1</span>;
<span class="hljs-keyword">while</span> <span class="hljs-built_in">i</span> &lt;= <span class="hljs-number">5</span>
    <span class="hljs-built_in">disp</span>(<span class="hljs-built_in">i</span>);
    <span class="hljs-built_in">i</span> = <span class="hljs-built_in">i</span> + <span class="hljs-number">1</span>;
<span class="hljs-keyword">end</span>
</code></pre>
<ul>
<li><code>1:5</code> produces <code>[1 2 3 4 5]</code> — loop variable takes each value in turn</li>
<li>Body executes once per value; no manual increment needed</li>
<li><code>for</code> is not magic — it is convenient syntax for a counted while loop</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="for-loop-iterating-over-arrays">For Loop: Iterating Over Arrays</h2>
<pre><code class="language-matlab">signals = [<span class="hljs-string">&quot;X&quot;</span>, <span class="hljs-string">&quot;Y&quot;</span>, <span class="hljs-string">&quot;Z&quot;</span>, <span class="hljs-string">&quot;Resultant&quot;</span>];   <span class="hljs-comment">% 1×4 string array</span>

<span class="hljs-keyword">for</span> k = <span class="hljs-number">1</span>:<span class="hljs-built_in">length</span>(signals)
    fprintf(<span class="hljs-string">&quot;Processing: %s\n&quot;</span>, signals(k));   <span class="hljs-comment">% same indexing as any array</span>
<span class="hljs-keyword">end</span>
</code></pre>
<ul>
<li><code>signals(k)</code> returns the k-th string — standard <code>()</code> indexing, same as numeric arrays</li>
<li><code>length(signals)</code> returns 4 — same <code>length</code> you use on any array</li>
</ul>
<pre><code class="language-matlab"><span class="hljs-comment">% Iterate directly over values (clean for fixed small sets)</span>
<span class="hljs-keyword">for</span> val = [<span class="hljs-number">1.5</span>, <span class="hljs-number">3.2</span>, <span class="hljs-number">7.8</span>]
    fprintf(<span class="hljs-string">&quot;Value: %.2f\n&quot;</span>, val);
<span class="hljs-keyword">end</span>
</code></pre>
<p>In MP projects: almost always use <code>1:length(x)</code> or <code>1:size(data,1)</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="28" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="nested-loops-how-many-iterations-4">Nested Loops: How Many Iterations?</h2>
<pre><code class="language-matlab">count = <span class="hljs-number">0</span>;
<span class="hljs-keyword">for</span> row = <span class="hljs-number">1</span>:<span class="hljs-number">3</span>
    <span class="hljs-keyword">for</span> col = <span class="hljs-number">1</span>:<span class="hljs-number">4</span>
        count = count + <span class="hljs-number">1</span>;
    <span class="hljs-keyword">end</span>
<span class="hljs-keyword">end</span>
<span class="hljs-built_in">disp</span>(count)
</code></pre>
<blockquote>
<p>&quot;What does <code>count</code> equal after this runs?&quot;</p>
</blockquote>
<p><strong>(a)</strong> 7      <strong>(b)</strong> 12      <strong>(c)</strong> 3      <strong>(d)</strong> 4 — <em>hands up</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="the-inner-loop-completes-first">The Inner Loop Completes First</h2>
<pre><code class="language-matlab">count = <span class="hljs-number">0</span>;
<span class="hljs-keyword">for</span> row = <span class="hljs-number">1</span>:<span class="hljs-number">3</span>
    <span class="hljs-keyword">for</span> col = <span class="hljs-number">1</span>:<span class="hljs-number">4</span>
        count = count + <span class="hljs-number">1</span>;
    <span class="hljs-keyword">end</span>
<span class="hljs-keyword">end</span>
<span class="hljs-built_in">disp</span>(count)
</code></pre>
<p>Answer: <strong>(b)</strong> — <code>count = 12</code></p>
<ul>
<li><code>row = 1</code> → col runs 1, 2, 3, 4 → 4 increments</li>
<li><code>row = 2</code> → col runs 1, 2, 3, 4 → 4 increments</li>
<li><code>row = 3</code> → col runs 1, 2, 3, 4 → 4 increments</li>
<li>Total: 3 × 4 = <strong>12</strong></li>
</ul>
<p>The inner loop is like the seconds hand on a clock — it completes a full revolution before the outer loop (the minute hand) advances by one.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="30" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="when-to-use-while-vs-for">When to Use While vs. For</h2>
<table>
<thead>
<tr>
<th>Use <code>while</code> when...</th>
<th>Use <code>for</code> when...</th>
</tr>
</thead>
<tbody>
<tr>
<td>You don't know how many iterations in advance</td>
<td>You know the count or range in advance</td>
</tr>
<tr>
<td>Stopping depends on incoming data or a computed result</td>
<td>Iterating over a fixed array or index range</td>
</tr>
<tr>
<td>Sensor logging until a threshold is met</td>
<td>Processing each column of a data matrix</td>
</tr>
<tr>
<td>Real-time collection: Group Project lab data collection</td>
<td>Batch processing known files: Group Project analysis loop</td>
</tr>
</tbody>
</table>
<div style="border: 2px dashed #888; border-radius: 14px; padding: 0.4rem 0.8rem; background: #f9f9f9; font-size: 0.82em; margin: 0.3rem 0;">
<strong>Good rule:</strong> if you can write <code>for i = 1:N</code> with a concrete N, use <code>for</code>. If you find yourself writing <code>while true</code> with a <code>break</code> — ask whether a proper <code>while condition</code> is cleaner.
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-class="activity" data-theme="eng6" lang="en-US" class="activity" data-marpit-pagination="31" style="--paginate:true;--class:activity;--theme:eng6;" data-marpit-pagination-total="51">
<h1 id="activity-1-three-ways-to-write-the-same-loop">Activity 1: Three Ways to Write the Same Loop</h1>

<h2 id="activity-1--debrief">Activity 1 — Debrief</h2>
<blockquote>
<p>&quot;Raise your hand if your vectorized version was faster than your <code>for</code> loop by more than 10×.&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="activity-1--discussion">Activity 1 — Discussion</h2>
<p><strong>Discussion anchors:</strong></p>
<ul>
<li>What does MATLAB do differently in the vectorized case that makes it so much faster than a loop?</li>
<li>All three implementations should produce identical <code>R</code> — if any pair returned <code>isequal</code> = false, where was the error?</li>
<li>Give one concrete example from this course where a loop is unavoidable — where step <code>i</code> depends on the result from step <code>i−1</code>.</li>
</ul>
<p><strong>Teaching point:</strong> The loop isn't wrong — it's sometimes the only tool that fits. The skill is knowing which situation you're in: a computation that vectorizes cleanly, or one where each step depends on the last.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="section" data-theme="eng6" lang="en-US" class="section" data-marpit-pagination="34" style="--paginate:true;--class:section;--theme:eng6;" data-marpit-pagination-total="51">
<h1 id="break-continue-and-early-exit">Break, Continue, and Early Exit</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="break-exit-early">Break: Exit Early</h2>
<pre><code class="language-matlab"><span class="hljs-comment">% Find the first sample exceeding threshold — stop as soon as found</span>
threshold = <span class="hljs-number">15</span>;
first_idx = <span class="hljs-number">-1</span>;

<span class="hljs-keyword">for</span> <span class="hljs-built_in">i</span> = <span class="hljs-number">1</span>:<span class="hljs-built_in">length</span>(R)
    <span class="hljs-keyword">if</span> R(<span class="hljs-built_in">i</span>) &gt; threshold
        first_idx = <span class="hljs-built_in">i</span>;
        <span class="hljs-keyword">break</span>;           <span class="hljs-comment">% exit the loop immediately</span>
    <span class="hljs-keyword">end</span>
<span class="hljs-keyword">end</span>
fprintf(<span class="hljs-string">&quot;First event at index %d\n&quot;</span>, first_idx);
</code></pre>
<ul>
<li><span style="color:#cc0000; font-weight:bold;"><code>break</code></span> exits the <strong>innermost</strong> loop only</li>
<li>Without <code>break</code>: scans the entire array even after finding the answer</li>
<li>Use case: searching for the first event, stopping early on a condition</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="36" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="continue-skip-an-iteration">Continue: Skip an Iteration</h2>
<pre><code class="language-matlab"><span class="hljs-comment">% Process samples — skip any that are NaN (bad sensor readings)</span>
clean_count = <span class="hljs-number">0</span>;
<span class="hljs-keyword">for</span> <span class="hljs-built_in">i</span> = <span class="hljs-number">1</span>:<span class="hljs-built_in">length</span>(R)
    <span class="hljs-keyword">if</span> <span class="hljs-built_in">isnan</span>(R(<span class="hljs-built_in">i</span>))
        <span class="hljs-keyword">continue</span>;        <span class="hljs-comment">% skip this iteration, jump to next i</span>
    <span class="hljs-keyword">end</span>
    clean_count = clean_count + <span class="hljs-number">1</span>;
    <span class="hljs-comment">% ... process R(i) ...</span>
<span class="hljs-keyword">end</span>
fprintf(<span class="hljs-string">&quot;%d clean samples processed\n&quot;</span>, clean_count);
</code></pre>
<ul>
<li><span style="color:#cc0000; font-weight:bold;"><code>continue</code></span> skips the rest of the current iteration, jumps to the next</li>
<li>Use case: filtering out bad or invalid data without stopping the loop</li>
<li><code>continue</code> skips one pass; <code>break</code> exits entirely — these are different</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="how-many-times-does-fprintf-run-4">How Many Times Does fprintf Run?</h2>
<pre><code class="language-matlab"><span class="hljs-keyword">for</span> file_idx = <span class="hljs-number">1</span>:<span class="hljs-number">3</span>
    <span class="hljs-keyword">for</span> sample_idx = <span class="hljs-number">1</span>:<span class="hljs-built_in">length</span>(R)
        <span class="hljs-keyword">if</span> R(sample_idx) &gt; <span class="hljs-number">25</span>
            <span class="hljs-keyword">break</span>;
        <span class="hljs-keyword">end</span>
    <span class="hljs-keyword">end</span>
    fprintf(<span class="hljs-string">&quot;Finished file %d\n&quot;</span>, file_idx);
<span class="hljs-keyword">end</span>
</code></pre>
<blockquote>
<p>&quot;How many times does <code>fprintf</code> run?&quot;</p>
</blockquote>
<p><strong>(a)</strong> 0      <strong>(b)</strong> 1      <strong>(c)</strong> 3      <strong>(d)</strong> depends on data — <em>hands up</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="42" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="break-scope-one-level-deep">Break Scope: One Level Deep</h2>
<pre><code class="language-matlab"><span class="hljs-keyword">for</span> file_idx = <span class="hljs-number">1</span>:<span class="hljs-number">3</span>
    <span class="hljs-keyword">for</span> sample_idx = <span class="hljs-number">1</span>:<span class="hljs-built_in">length</span>(R)
        <span class="hljs-keyword">if</span> R(sample_idx) &gt; <span class="hljs-number">25</span>
            <span class="hljs-keyword">break</span>;                 <span class="hljs-comment">% exits inner loop only</span>
        <span class="hljs-keyword">end</span>
    <span class="hljs-keyword">end</span>
    fprintf(<span class="hljs-string">&quot;Finished file %d\n&quot;</span>, file_idx);  <span class="hljs-comment">% outer loop continues</span>
<span class="hljs-keyword">end</span>
</code></pre>
<p>Answer: <strong>(c)</strong> — <code>fprintf</code> runs <strong>exactly 3 times</strong>, regardless of data</p>
<ul>
<li><code>break</code> exits the <em>inner</em> loop — control returns to the <strong>outer</strong> loop's next iteration</li>
<li>The outer loop is not affected by <code>break</code> in the inner loop</li>
<li>To exit <em>all</em> loops: set a flag variable and check it in each loop's condition</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="when-is-a-loop-unavoidable">When Is a Loop Unavoidable?</h2>
<p>Vectorized operations cannot replace a loop when <strong>each step depends on the previous result:</strong></p>
<pre><code class="language-matlab"><span class="hljs-comment">% Cumulative sum — loop version</span>
running_total = <span class="hljs-number">0</span>;
<span class="hljs-keyword">for</span> <span class="hljs-built_in">i</span> = <span class="hljs-number">1</span>:<span class="hljs-built_in">length</span>(x)
    running_total = running_total + x(<span class="hljs-built_in">i</span>);
    totals(<span class="hljs-built_in">i</span>) = running_total;
<span class="hljs-keyword">end</span>

<span class="hljs-comment">% MATLAB built-in — same logic wrapped for you</span>
totals = cumsum(x);
</code></pre>
<ul>
<li><code>cumtrapz</code> from MP4 dead reckoning follows the same pattern: step <code>i</code> needs step <code>i-1</code>'s result</li>
<li><strong>Rule:</strong> if the computation at step <code>i</code> needs the result from step <code>i-1</code>, you need a loop</li>
<li>Built-ins like <code>cumsum</code> and <code>cumtrapz</code> wrap those loops internally</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-class="activity" data-theme="eng6" lang="en-US" class="activity" data-marpit-pagination="44" style="--paginate:true;--class:activity;--theme:eng6;" data-marpit-pagination-total="51">

<h2 id="what-you-can-do-now--lab-bridge">What You Can Do Now + Lab Bridge</h2>
<p><strong>You can now:</strong></p>

<li>Use <code>continue</code> to skip invalid or uninteresting data</li>

</ul>
<p><strong>In this week's lab:</strong> collect your Group Project accelerometer data — use the <code>while</code> logging pattern (<code>while size(accellog(m),1) &lt; target</code>) to capture enough samples for each activity.</p>
<p><strong>Activity 2 today:</strong> the <code>for</code> loop over a string array of filenames is your batch analysis skeleton — it processes the files you collect in lab. Save it before you leave.</p>
<p><strong>Coming in L12:</strong> you'll design a results structure — replacing the plain <code>results</code> array with named fields (<code>results(i).peak</code>, <code>results(i).activity</code>) to keep everything about each recording in one place.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
<h2 id="decision-framework-choosing-your-loop">Decision Framework: Choosing Your Loop</h2>
<table>
<thead>
<tr>
<th>Situation</th>
<th>Tool</th>
</tr>
</thead>
<tbody>
<tr>
<td>Iterate a fixed number of times or over a known array</td>
<td><code>for</code></td>
</tr>
<tr>
<td>Keep going until a condition changes</td>
<td><code>while</code></td>
</tr>
<tr>
<td>Stop the moment you find what you need</td>
<td><code>break</code> inside either</td>
</tr>
<tr>
<td>Skip invalid or uninteresting data</td>
<td><code>continue</code> inside either</td>
</tr>
<tr>
<td>Compute running totals or cumulative quantities</td>
<td><code>cumsum</code>, <code>cumtrapz</code> (loops internally)</td>
</tr>
<tr>
<td>Apply the same analysis to many files</td>
<td><code>for</code> over a cell array of filenames</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="eng6" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:eng6;" data-marpit-pagination-total="51">
